<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue - HP Store</title>
  <meta name="description" content="Découvrez nos PC portables, PC de bureau, imprimantes et accessoires HP.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/catalogue.css">
</head>
<body>

  <!-- TEMPORAIRE : à remplacer par la navbar du membre 1 (même code que index.html) -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">HP Store</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal" aria-controls="menu-principal" aria-expanded="false" aria-label="Ouvrir le menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu-principal">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="catalogue.html">Catalogue</a></li>
        </ul>
        <a class="btn btn-outline-primary" href="panier.html">Panier <span class="badge text-bg-primary" id="compteur-panier">0</span></a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h2 mb-3">Tous nos produits</h1>

    <div class="row g-4">

      <!-- Filtres -->
      <aside class="col-lg-3" aria-label="Filtres">
        <button class="btn btn-outline-primary w-100 d-lg-none mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#panneau-filtres" aria-expanded="false" aria-controls="panneau-filtres">
          Afficher les filtres
        </button>
        <div class="collapse d-lg-block" id="panneau-filtres">
          <form id="formulaire-filtres" class="panneau-filtres p-3 border rounded" novalidate>
            <div class="mb-3">
              <label for="filtre-recherche" class="form-label">Rechercher par nom</label>
              <input type="search" class="form-control" id="filtre-recherche" placeholder="Ex : OmniBook">
            </div>
            <div class="mb-3">
              <label for="filtre-categorie" class="form-label">Catégorie</label>
              <select class="form-select" id="filtre-categorie">
                <option value="">Toutes les catégories</option>
                <option value="pc-portables">PC portables</option>
                <option value="pc-bureau">PC de bureau</option>
                <option value="imprimantes">Imprimantes</option>
                <option value="accessoires">Accessoires</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="filtre-usage" class="form-label">Usage</label>
              <select class="form-select" id="filtre-usage">
                <option value="">Tous les usages</option>
                <option value="maison">Maison</option>
                <option value="pro">Professionnel</option>
                <option value="gaming">Gaming</option>
              </select>
            </div>
            <fieldset class="mb-3">
              <legend class="form-label fs-6">Prix (€)</legend>
              <div class="row g-2">
                <div class="col-6">
                  <label for="filtre-prix-min" class="visually-hidden">Prix minimum</label>
                  <input type="number" class="form-control" id="filtre-prix-min" min="0" step="1" placeholder="Min">
                </div>
                <div class="col-6">
                  <label for="filtre-prix-max" class="visually-hidden">Prix maximum</label>
                  <input type="number" class="form-control" id="filtre-prix-max" min="0" step="1" placeholder="Max">
                </div>
              </div>
            </fieldset>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="filtre-dispo">
              <label class="form-check-label" for="filtre-dispo">En stock uniquement</label>
            </div>
