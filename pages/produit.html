<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fiche produit - HP Store</title>
  <meta name="description" content="Fiche détaillée d'un produit HP : caractéristiques, prix et disponibilité.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/produits.css">
</head>
<body>

  <!-- TEMPORAIRE : à remplacer par la navbar du membre 1 (même code que index.html) -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">HP Store</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal" aria-controls="menu-principal" aria-expanded="false" aria-label="Ouvrir le menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu-principal">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="catalogue.html">Catalogue</a></li>
        </ul>
        <a class="btn btn-outline-primary" href="panier.html">Panier <span class="badge text-bg-primary" id="compteur-panier">0</span></a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <nav aria-label="Fil d'Ariane">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="../index.html">Accueil</a></li>
        <li class="breadcrumb-item"><a href="catalogue.html">Catalogue</a></li>
        <li class="breadcrumb-item active" aria-current="page" id="fil-nom">Produit</li>
      </ol>
    </nav>

    <h1 class="h2 mb-4" id="produit-titre">Chargement du produit…</h1>

    <!-- Produit introuvable ou erreur de chargement -->
    <div class="alert alert-warning d-none" id="erreur-produit" role="alert">
      <p class="mb-3" id="texte-erreur"></p>
      <a class="btn btn-primary" href="catalogue.html">Retour au catalogue</a>
    </div>

    <!-- Fiche produit (remplie par js/produit.js) -->
    <div class="d-none" id="fiche-produit">
      <div class="row g-4">

        <div class="col-md-6">
          <img id="image-principale" class="fiche-image-principale"
               src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
               alt="" width="800" height="600">
          <div class="d-flex flex-wrap gap-2 mt-3" id="miniatures"></div>
        </div>

        <div class="col-md-6">
          <p class="text-body-secondary mb-2" id="produit-reference"></p>
          <p class="mb-3" id="produit-stock"></p>
          <p class="fiche-prix mb-0" id="produit-prix"></p>
          <p class="text-body-secondary">TVA incluse</p>
          <p id="produit-description"></p>
          <p>Usage : <span id="produit-usage"></span></p>

          <form id="formulaire-ajout" class="mt-4">
            <div class="d-flex flex-wrap align-items-end gap-3">
              <div>
                <label for="quantite" class="form-label">Quantité</label>
                <input type="number" class="form-control fiche-quantite" id="quantite" value="1" min="1" step="1" required>
              </div>
              <button type="submit" class="btn btn-primary btn-lg" id="btn-ajouter">Ajouter au panier</button>
            </div>
          </form>

          <div class="alert d-none mt-3" id="message-ajout" role="status">
            <span id="message-texte"></span>
            <a class="alert-link ms-2 d-none" id="lien-panier" href="panier.html">Voir le panier</a>
          </div>
        </div>
      </div>

      <section class="mt-5" aria-labelledby="titre-caracteristiques">
        <h2 class="h4" id="titre-caracteristiques">Caractéristiques</h2>
        <div class="table-responsive">
          <table class="table table-striped fiche-tableau">
            <caption class="visually-hidden">Caractéristiques techniques du produit</caption>
            <tbody id="tableau-caracteristiques"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <!-- TEMPORAIRE : à remplacer par le pied de page du membre 1 -->
  <footer class="border-top py-4 mt-5 text-center text-body-secondary">
    <p class="mb-0">Site de démonstration : aucune commande n'est réellement traitée.</p>
  </footer>

  <script src="../js/panier.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/produit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
